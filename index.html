<script>
    let clientData = [];

    document.getElementById('fileUpload').addEventListener('change', handleFileUpload);
    document.getElementById('filterTier').addEventListener('change', renderTable);

    function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function (e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });

            // Read the first sheet
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];

            // Convert sheet to JSON
            const rawJson = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
            processExcelData(rawJson);
        };
        reader.readAsArrayBuffer(file);
    }

    // Helper to search row keys flexibly
    function getRowValue(row, possibleKeys) {
        const keys = Object.keys(row);
        for (let targetKey of possibleKeys) {
            const matchedKey = keys.find(k => k.trim().toLowerCase().replace(/[\s_]+/g, '') === targetKey.toLowerCase().replace(/[\s_]+/g, ''));
            if (matchedKey && row[matchedKey] !== undefined && row[matchedKey] !== "") {
                return row[matchedKey];
            }
        }
        return null;
    }

    function processExcelData(data) {
        clientData = data.map(row => {
            // Flexible matching for Client Name
            const client = getRowValue(row, ['Client Name', 'Client', 'Client_Name', 'Customer', 'Account']) || 'Unknown Client';
            
            // Flexible matching for Package Name
            const pkg = getRowValue(row, ['Package Name', 'Package', 'Package_Name', 'Service', 'Plan']) || 'N/A';
            
            // Flexible matching for Probability Score
            let rawProb = getRowValue(row, ['Probability Score', 'Probability', 'Probability%', 'Score', 'Chance', 'Likelihood', 'Prob']);
            
            let probPercent = 0;
            if (rawProb !== null && rawProb !== undefined) {
                if (typeof rawProb === 'string') {
                    const cleanStr = rawProb.replace('%', '').trim();
                    const num = parseFloat(cleanStr);
                    if (!isNaN(num)) {
                        probPercent = rawProb.includes('%') || num > 1 ? Math.round(num) : Math.round(num * 100);
                    }
                } else if (typeof rawProb === 'number') {
                    probPercent = rawProb > 1 ? Math.round(rawProb) : Math.round(rawProb * 100);
                }
            }

            // Assign Tier based on score
            let tier = 'LOW';
            if (probPercent >= 70) tier = 'HIGH';
            else if (probPercent >= 40) tier = 'MEDIUM';

            return { client, package: pkg, probability: probPercent, tier };
        });

        updateMetrics();
        renderTable();
    }

    function updateMetrics() {
        document.getElementById('statTotal').innerText = clientData.length;
        document.getElementById('statHigh').innerText = clientData.filter(d => d.tier === 'HIGH').length;
        document.getElementById('statMed').innerText = clientData.filter(d => d.tier === 'MEDIUM').length;
        document.getElementById('statLow').innerText = clientData.filter(d => d.tier === 'LOW').length;
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        const selectedTier = document.getElementById('filterTier').value;

        const filteredData = clientData.filter(item => {
            if (selectedTier === 'ALL') return true;
            return item.tier === selectedTier;
        });

        if (filteredData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="py-6 text-center text-gray-500">No records found.</td></tr>`;
            return;
        }

        tbody.innerHTML = filteredData.map(item => {
            let badgeStyle = 'bg-red-500/10 text-red-400 border-red-500/20';
            let barColor = 'bg-red-500';

            if (item.tier === 'HIGH') {
                badgeStyle = 'bg-green-500/10 text-green-400 border-green-500/20';
                barColor = 'bg-green-500';
            } else if (item.tier === 'MEDIUM') {
                badgeStyle = 'bg-yellow-500/10 text-yellow-400 border-yellow-500/20';
                barColor = 'bg-yellow-500';
            }

            return `
                <tr class="hover:bg-gray-750 border-b border-gray-700/50">
                    <td class="py-3 px-4 font-semibold text-white">${item.client}</td>
                    <td class="py-3 px-4 text-gray-300">${item.package}</td>
                    <td class="py-3 px-4">
                        <div class="flex items-center space-x-3">
                            <span class="font-semibold text-white w-10">${item.probability}%</span>
                            <div class="w-32 bg-gray-700 h-2 rounded-full overflow-hidden">
                                <div class="${barColor} h-full rounded-full" style="width: ${Math.min(item.probability, 100)}%"></div>
                            </div>
                        </div>
                    </td>
                    <td class="py-3 px-4">
                        <span class="px-2.5 py-1 text-xs font-medium rounded-full border ${badgeStyle}">
                            ${item.tier}
                        </span>
                    </td>
                </tr>
            `;
        }).join('');
    }
</script>
